name: Release SignSecure Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@signsecure"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: node -e "const version = require('./package.json').version; const tag = process.env.GITHUB_REF_NAME.slice(1); if (version !== tag) { throw new Error('Tag v' + tag + ' does not match package version ' + version); }"

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test:run

      - name: Build package
        run: bun run build

      - name: Publish package
        run: npm publish --ignore-scripts --tag signsecure
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
